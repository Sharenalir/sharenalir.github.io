<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fate Core — листы персонажей</title>
<style>
:root{--bg:#12161c;--panel:#1b212b;--tx:#dfe6ee;--mut:#8b97a6;--acc:#3a8f94;--paper:#f2f4f0;--ink:#1a2330;--ln:#b9c3c0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Palatino Linotype',Palatino,Georgia,serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid #000}
h1{font-size:19px;margin:0;flex:1;min-width:160px;font-weight:700}
#st{color:var(--mut);font-size:13px}
button{font:inherit;background:#26303d;color:var(--tx);border:1px solid #384555;border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{display:grid;grid-template-columns:210px 1fr;gap:16px;padding:16px;max-width:1120px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
aside button.c{display:block;width:100%;text-align:left;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside button.c.on{border-color:var(--acc);background:#223a40}
aside .add{width:100%;margin-bottom:12px}
.del{color:#d9877a;margin-top:8px;width:100%}
#sheet{background:var(--paper);color:var(--ink);padding:22px;border-radius:4px;display:grid;gap:16px}
#sheet h2{font-size:15px;margin:0 0 6px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
#sheet input,#sheet textarea,#sheet select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--ln);width:100%;padding:3px 2px;border-radius:0}
#sheet textarea{border:1px solid var(--ln);border-radius:3px;min-height:70px;padding:6px;resize:vertical;line-height:1.4}
#sheet .nm{font-size:26px;font-weight:700}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cols{display:grid;gap:18px;grid-template-columns:1.3fr 1fr}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.lb{font-size:12px;color:#55636f;display:block}
.asp{display:grid;gap:8px}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 18px}
.sk div{display:flex;align-items:center;gap:6px;border-bottom:1px dotted var(--ln);padding:2px 0}
.sk label{flex:1}
.sk select{width:62px!important;border:1px solid var(--ln)!important;border-radius:3px;text-align:center;font-weight:700}
.sk .on label{font-weight:700}
.sk .on select,.sk .sv.on{background:var(--ink)!important;color:#fff!important}
.sk .x{border:0;background:none;color:#a5473a;padding:0 4px;font-size:16px}
.addsk{display:flex;gap:8px;margin-top:10px}
.addsk input{border:1px solid var(--ln)!important;border-radius:3px;padding:5px 8px!important}
#sheet button{background:var(--ink);color:#fff;border-color:var(--ink)}
.sum{font-size:13px;color:#55636f;margin-top:6px}
.bx{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.bx b{width:70px;font-weight:400}
.bx label{width:30px;height:30px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;font-size:13px;cursor:pointer;position:relative}
.bx input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.bx label:has(input:checked){background:var(--ink);color:#fff}
.cn{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.fp{display:flex;gap:8px}
.exp .noexp{display:none!important}
.tv{white-space:pre-wrap;border:1px solid var(--ln);border-radius:3px;padding:6px;min-height:70px;line-height:1.4}
.sv{display:inline-block;width:62px;text-align:center;font-weight:700;border:1px solid var(--ln);border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>Fate Core — листы персонажей</h1>
  <span id="st"></span>
  <button id="auth">Войти через Google</button>
  <button id="png" class="p">Скачать PNG</button>
</header>
<main>
  <aside><button class="add p" id="new">+ Новый персонаж</button><div id="list"></div></aside>
  <div id="sheet"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===== НАСТРОЙКА =====
   Вставьте OAuth Client ID (тип «Web application») из Google Cloud Console.
   В «Authorized JavaScript origins» добавьте адрес, где лежит этот файл.
   Нужно включить Google Drive API. Данные хранятся в скрытой папке приложения (appDataFolder). */
const GOOGLE_CLIENT_ID = '431659431327-j3v6n9lln1fq31opo2bh3omfdp26ggv8.apps.googleusercontent.com';

const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DEF = ['Атлетика','Взлом','Взаимопонимание','Внимание','Вождение','Воля','Драка','Знания','Контакты','Обман','Провокация','Расследование','Ремесло','Ресурсы','Скрытность','Стрельба','Телосложение','Эмпатия'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let chars = [], cur = null, token = null, fileId = null, tc = null, timer;

function load(){ try{ chars = JSON.parse(localStorage.getItem('fate_chars')) || []; }catch(e){ chars = []; } }
function mk(){
  const skills = {}; DEF.forEach(n => skills[n] = 0);
  return {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), u: Date.now(), name:'Новый персонаж', player:'', refresh:3, fp:3, desc:'',
    asp:{hc:'',tr:'',a3:'',a4:'',a5:''}, skills, stunts:'', extras:'', stress:{p:[0,0,0,0], m:[0,0,0,0]}, cons:{mild:'',mod:'',sev:'',mild2:''}};
}
const alive = () => chars.filter(c => !c.del);
const get = k => k.split('.').reduce((o,p) => o?.[p], cur);
function set(k, v){ const p = k.split('.'), l = p.pop(); p.reduce((o,x) => o[x], cur)[l] = v; }

function st(t){ $('#st').textContent = t; }
function save(){
  localStorage.setItem('fate_chars', JSON.stringify(chars));
  if(!token) return;
  st('Сохранение…'); clearTimeout(timer);
  timer = setTimeout(() => push().then(() => st('Синхронизировано '+new Date().toLocaleTimeString())).catch(() => st('Ошибка синхронизации')), 1500);
}
function touch(){ cur.u = Date.now(); save(); renderList(); }

/* ===== Google Drive ===== */
const D = 'https://www.googleapis.com/drive/v3/files', U = 'https://www.googleapis.com/upload/drive/v3/files';
async function api(url, opt = {}){
  const r = await fetch(url, {...opt, headers:{...opt.headers, Authorization:'Bearer '+token}});
  if(r.status === 401){ token = null; setAuth(); throw new Error('auth'); }
  if(!r.ok) throw new Error(r.status);
  return r;
}
async function pull(){
  const r = await (await api(D+"?spaces=appDataFolder&q=name%3D'fate-core.json'&fields=files(id)")).json();
  fileId = r.files[0]?.id; if(!fileId) return null;
  return (await api(D+'/'+fileId+'?alt=media')).json();
}
async function push(){
  const meta = {name:'fate-core.json'}; if(!fileId) meta.parents = ['appDataFolder'];
  const b = 'fatebnd';
  const body = `--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(chars)}\r\n--${b}--`;
  const r = await api(`${U}${fileId ? '/'+fileId : ''}?uploadType=multipart&fields=id`, {method: fileId ? 'PATCH' : 'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
  fileId = (await r.json()).id;
}
function merge(rem){
  const m = new Map(chars.map(c => [c.id, c]));
  (rem || []).forEach(r => { const l = m.get(r.id); if(!l || r.u > l.u) m.set(r.id, r); });
  chars = [...m.values()];
}
async function sync(){
  st('Синхронизация…');
  try{
    merge(await pull());
    if(!cur || cur.del) cur = alive()[0] || null;
    if(cur) cur = chars.find(c => c.id === cur.id);
    localStorage.setItem('fate_chars', JSON.stringify(chars));
    await push(); renderList(); render();
    st('Синхронизировано '+new Date().toLocaleTimeString());
  }catch(e){ st('Ошибка синхронизации'); }
}
function setAuth(){ $('#auth').textContent = token ? 'Выйти из Google' : 'Войти через Google'; if(!token) st('Данные только в этом браузере'); }
$('#auth').onclick = () => {
  if(token){ google.accounts.oauth2.revoke(token); token = null; fileId = null; setAuth(); return; }
  if(!GOOGLE_CLIENT_ID){ alert('Укажите GOOGLE_CLIENT_ID в начале скрипта (см. комментарий в коде).'); return; }
  if(typeof google === 'undefined'){ alert('Скрипт Google не загрузился. Проверьте соединение.'); return; }
  tc = tc || google.accounts.oauth2.initTokenClient({client_id: GOOGLE_CLIENT_ID, scope: SCOPE,
    callback: r => { if(r.error){ st('Не удалось войти'); return; } token = r.access_token; setAuth(); sync(); }});
  tc.requestAccessToken();
};

/* ===== Интерфейс ===== */
function renderList(){
  $('#list').innerHTML = alive().sort((a,b) => b.u - a.u).map(c =>
    `<button class="c ${c === cur ? 'on' : ''}" data-id="${c.id}">${esc(c.name) || 'Без имени'}</button>`).join('');
}
function stressN(v){ return v >= 3 ? 4 : v >= 1 ? 3 : 2; }
function boxes(t, label, n){
  let h = `<div class="bx"><b>${label}</b>`;
  for(let i = 0; i < n; i++) h += `<label>${i+1}<input type="checkbox" data-k="stress.${t}.${i}" ${cur.stress[t][i] ? 'checked' : ''}></label>`;
  return h + '</div>';
}
const inp = (k, ph, cls = '') => `<input data-k="${k}" placeholder="${ph}" value="${esc(get(k))}" class="${cls}">`;
const ta = (k, ph) => `<textarea data-k="${k}" placeholder="${ph}">${esc(get(k))}</textarea>`;

function render(){
  const s = $('#sheet');
  if(!cur){ s.innerHTML = '<p>Создайте первого персонажа кнопкой слева.</p>'; return; }
  const sk = cur.skills, names = Object.keys(sk);
  const cnt = {}; let tot = 0;
  names.forEach(n => { if(sk[n] > 0){ cnt[sk[n]] = (cnt[sk[n]] || 0) + 1; tot++; } });
  const top = Math.max(0, ...Object.keys(cnt).map(Number));
  let ok = true; for(let l = 1; l < top; l++) if((cnt[l] || 0) < (cnt[l+1] || 0)) ok = false;
  const opts = v => [...Array(9).keys()].map(i => `<option value="${i}" ${i === v ? 'selected' : ''}>${i ? '+'+i : '—'}</option>`).join('');
  const skHtml = names.map(n => `<div class="${sk[n] > 0 ? 'on' : ''}"><label>${esc(n)}</label>
    <select data-k="skills.${esc(n)}">${opts(+sk[n])}</select>
    ${DEF.includes(n) ? '' : `<button class="x noexp" data-del="${esc(n)}" title="Удалить навык">×</button>`}</div>`).join('');
  const a = cur.asp;
  s.innerHTML = `
  <div class="row" style="grid-template-columns:2fr 1fr 90px 90px">
    <div><span class="lb">Имя персонажа</span>${inp('name','Имя','nm')}</div>
    <div><span class="lb">Игрок</span>${inp('player','Игрок')}</div>
    <div><span class="lb">Темп</span><input data-k="refresh" type="number" min="0" value="${esc(cur.refresh)}"></div>
    <div><span class="lb">Очки Судьбы</span><input data-k="fp" type="number" min="0" value="${esc(cur.fp)}"></div>
  </div>
  <div><h2>Описание</h2>${ta('desc','Внешность, прошлое, характер…')}</div>
  <div class="cols">
    <div>
      <h2>Аспекты</h2>
      <div class="asp">
        <div><span class="lb">Концепция</span>${inp('asp.hc','Главный аспект')}</div>
        <div><span class="lb">Проблема</span>${inp('asp.tr','Что вечно мешает')}</div>
        <div><span class="lb">Аспект</span>${inp('asp.a3','')}</div>
        <div><span class="lb">Аспект</span>${inp('asp.a4','')}</div>
        <div><span class="lb">Аспект</span>${inp('asp.a5','')}</div>
      </div>
      <h2 style="margin-top:16px">Навыки</h2>
      <div class="sk">${skHtml}</div>
      <div class="sum">Навыков с рангом: ${tot}. ${tot ? (ok ? 'Пирамида соблюдена.' : 'Пирамида нарушена: на каждом уровне должно быть не меньше навыков, чем на следующем.') : ''}</div>
      <div class="addsk noexp"><input id="nsk" placeholder="Свой навык, например «Магия»"><button id="addsk">Добавить</button></div>
    </div>
    <div>
      <h2>Стресс</h2>
      ${boxes('p','Телесный',stressN(+sk['Телосложение']||0))}
      ${boxes('m','Душевный',stressN(+sk['Воля']||0))}
      <h2>Последствия</h2>
      <div class="cn"><span class="lb">Лёгкое (2)</span>${inp('cons.mild','')}</div>
      <div class="cn"><span class="lb">Среднее (4)</span>${inp('cons.mod','')}</div>
      <div class="cn"><span class="lb">Тяжёлое (6)</span>${inp('cons.sev','')}</div>
      <div class="cn"><span class="lb">Лёгкое доп.</span>${inp('cons.mild2','')}</div>
    </div>
  </div>
  <div><h2>Трюки</h2>${ta('stunts','Название и эффект каждого трюка')}</div>
  <div><h2>Экстра и заметки</h2>${ta('extras','Снаряжение, особые правила, заметки')}</div>
  <button class="del noexp" id="rm" style="background:none;color:#a5473a;border-color:#a5473a">Удалить персонажа</button>`;
}

$('#sheet').addEventListener('input', e => {
  const t = e.target, k = t.dataset.k; if(!k || !cur) return;
  set(k, t.type === 'checkbox' ? (t.checked ? 1 : 0) : t.type === 'number' ? (+t.value || 0) : t.tagName === 'SELECT' ? +t.value : t.value);
  touch();
  if(t.tagName === 'SELECT') render();
});
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'addsk') addSkill();
  else if(t.dataset.del){ delete cur.skills[t.dataset.del]; touch(); render(); }
  else if(t.id === 'rm' && confirm('Удалить «'+cur.name+'»?')){
    cur.del = true; touch(); cur = alive()[0] || null; renderList(); render();
  }
});
$('#sheet').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'nsk') addSkill(); });
function addSkill(){
  const n = $('#nsk').value.trim().replace(/[.]/g, '');
  if(!n || n in cur.skills) return;
  cur.skills[n] = 0; touch(); render();
}
$('#list').onclick = e => { const id = e.target.dataset.id; if(id){ cur = chars.find(c => c.id === id); renderList(); render(); } };
$('#new').onclick = () => { cur = mk(); chars.push(cur); touch(); render(); };

$('#png').onclick = async () => {
  if(!cur) return;
  const el = $('#sheet'); el.classList.add('exp');
  try{
    const cv = await html2canvas(el, {scale: 2, backgroundColor: '#f2f4f0', onclone: d => {
      d.querySelectorAll('#sheet select').forEach(s => {
        const x = d.createElement('span'); x.className = 'sv' + (+s.value > 0 ? ' on' : ''); x.textContent = s.options[s.selectedIndex].text; s.replaceWith(x); });
      d.querySelectorAll('#sheet textarea').forEach(t => {
        const x = d.createElement('div'); x.className = 'tv'; x.textContent = t.value; t.replaceWith(x); });
    }});
    const a = document.createElement('a');
    a.download = (cur.name || 'character') + '.png'; a.href = cv.toDataURL('image/png'); a.click();
  }catch(e){ alert('Не удалось создать PNG: ' + e.message); }
  el.classList.remove('exp');
};

load();
if(!alive().length){ cur = mk(); chars.push(cur); save(); } else cur = alive().sort((a,b) => b.u - a.u)[0];
renderList(); render(); setAuth();
</script>
</body>
</html>
